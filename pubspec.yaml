name: precision_parts_frontend
description: PartMo — certified automotive spare parts e-commerce app.
publish_to: "none"
version: 1.0.1+3

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  google_fonts: ^6.2.1
  intl: ^0.19.0
  supabase_flutter: ^2.5.0
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  pdf: ^3.11.1
  printing: ^5.13.1
  razorpay_flutter: ^1.4.0
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^10.3.1
  js: ^0.7.1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Variable.ttf
  assets:
    - assets/branding/
    - assets/categories/
    - assets/brands/
    - assets/brands/local/
    - assets/car_types/
    - assets/promo/
